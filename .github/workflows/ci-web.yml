name: CI - Web (Next.js)

on:
  push:
    branches: [main, develop]
    paths:
      - 'apps/web/**'
      - 'package.json'
      - '.github/workflows/ci-web.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'apps/web/**'
      - 'package.json'
      - '.github/workflows/ci-web.yml'

jobs:
  lint-build:
    name: Lint & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          # Le monorepo utilise les npm workspaces : un seul lockfile à la racine.
          cache-dependency-path: package-lock.json

      - name: Install dependencies (whole workspace)
        run: npm ci

      - name: Lint
        run: npm run lint:web

      - name: Type-check & Build
        run: npm run build:web
        env:
          # Variables factices suffisantes pour valider le build en CI.
          # Le vrai déploiement (Vercel) utilise les variables du dashboard Vercel.
          NEXT_PUBLIC_API_URL: http://localhost:3001/api

  # Le déploiement en lui-même est géré nativement par l'intégration
  # GitHub <-> Vercel (déploiement automatique sur push vers main/develop,
  # avec "Root Directory" réglé sur apps/web dans les paramètres du projet Vercel).
  # Ce workflow sert uniquement de garde-fou qualité avant merge.
